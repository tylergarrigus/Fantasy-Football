<title>Fantasy Command Center</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<style>
/* Fantasy Command Center -- one narrow phone column, five tabs, dark by choice.
   Every semantic state is a shape + a word + a color, never color alone:
     ▲ favorable (cyan)   ▼ risk (orange)   ◆ caution (gold)   ● neutral (slate)
   The cyan/orange pair survives red-green and blue-yellow blindness and grayscale. */
:root{
  color-scheme:dark;
  --bg:#070A10; --s1:#0D121A; --s2:#131A24; --s3:#1A2330; --s4:#222D3C;
  --line:#1F2937; --line2:#2E3B4E;
  --fg:#F2F5FA; --mute:#98A6BB; --dim:#64748B;
  --acc:#4DB8FF; --acc2:#8B7CFF; --acc-ink:#04101D; --acc-bg:rgba(77,184,255,.14);
  --up:#5CD2FF; --up-bg:rgba(92,210,255,.14);
  --dn:#FF8A3D; --dn-bg:rgba(255,138,61,.16);
  --cau:#FFD76A; --cau-bg:rgba(255,215,106,.14);
  --neu:#8A99B0; --neu-bg:rgba(138,153,176,.14);
  --qb:#B9A8FF; --rb:#5FE4CB; --wr:#FFD66B; --te:#FF9FB6; --kd:#9FB1C6; --pos-ink:#07101A;
  --ui:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:18px; --r2:12px;
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.3,1.35,.5,1);
  --t:.22s;
}
:root[data-accent="violet"]{--acc:#A595FF;--acc2:#4DB8FF;--acc-bg:rgba(165,149,255,.16)}
:root[data-accent="mint"]{--acc:#5FE4CB;--acc2:#4DB8FF;--acc-bg:rgba(95,228,203,.14);--acc-ink:#04140F}
:root[data-density="compact"]{--r:14px;--r2:10px}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font:500 16px/1.4 var(--ui);
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
.glow{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(70% 40% at 50% -10%,color-mix(in srgb,var(--acc) 22%,transparent),transparent 70%)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,select{font:inherit;color:inherit}
a{color:inherit}
b,strong{font-weight:800}
small{font-size:12.5px;color:var(--mute);font-weight:600}
h1,h2,h3,h4,p,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
svg{display:block}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.app{max-width:560px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(104px + env(safe-area-inset-bottom,0px))}

/* ---------- header ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;padding-block:12px 10px;display:grid;gap:10px;
  background:linear-gradient(180deg,var(--bg) 80%,transparent)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:40px}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:17px;letter-spacing:-.01em}
.logo i{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:12px;font-weight:800;letter-spacing:.02em;
  color:var(--acc-ink);background:linear-gradient(135deg,var(--acc),var(--acc2));font-style:normal}
.logo small{display:block;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;line-height:1.1}
.fresh{display:flex;align-items:center;gap:8px;margin-left:auto}
.fresh span{font-size:12px;color:var(--mute);font-weight:700;text-align:right;line-height:1.25}
.fresh span b{color:var(--fg)}
.fresh i{width:8px;height:8px;border-radius:99px;background:var(--neu);flex:none}
.fresh i.ok{background:var(--up)} .fresh i.old{background:var(--cau)} .fresh i.stale{background:var(--dn)}
.icobtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--s2);border:1px solid var(--line);
  transition:transform var(--t) var(--spring),background var(--t)}
.icobtn:active{transform:scale(.92)}
.icobtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.seg{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:4px;isolation:isolate}
.seg>i{position:absolute;z-index:-1;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/var(--n,2));border-radius:10px;background:var(--s3);
  border:1px solid var(--line2);transform:translateX(calc(var(--x,0)*100%));transition:transform .4s var(--spring)}
.seg button{min-height:40px;padding:6px 10px;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:7px;font-weight:800;font-size:14px;color:var(--mute);transition:color var(--t)}
.seg button[aria-pressed="true"]{color:var(--fg)}
.seg .n{min-width:20px;height:20px;padding:0 6px;border-radius:99px;display:grid;place-items:center;font-size:11.5px;font-weight:800;font-style:normal;background:var(--dn);color:#1A0D04}
.seg .n.ok{background:var(--up-bg);color:var(--up)}

/* ---------- main / enter motion ---------- */
main{display:grid;gap:12px}
.v{display:grid;gap:12px;animation:vin .32s var(--ease) both}
.v>*{animation:cin .45s var(--ease) both;animation-delay:calc(var(--i,0)*45ms)}
@keyframes vin{from{opacity:0;transform:translateY(6px)}}
@keyframes cin{from{opacity:0;transform:translateY(10px) scale(.985)}}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:8px 4px 0}
.sec h2{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);font-weight:800}
.sec button,.sec a{font-size:13px;font-weight:800;color:var(--acc);text-decoration:none}

/* ---------- cards ---------- */
.card{background:linear-gradient(170deg,var(--s2),var(--s1) 70%);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px;min-width:0}
.card.hi{border-color:color-mix(in srgb,var(--acc) 45%,var(--line));box-shadow:0 0 0 1px color-mix(in srgb,var(--acc) 25%,transparent),0 20px 50px -30px color-mix(in srgb,var(--acc) 60%,transparent)}
.card.risk{border-color:color-mix(in srgb,var(--dn) 55%,var(--line))}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.ttl{font-size:19px;font-weight:800;line-height:1.15;letter-spacing:-.01em;text-wrap:balance}
.ttl.lg{font-size:22px}
.sub{color:var(--mute);font-size:13.5px;line-height:1.4}
.big{font-size:44px;font-weight:800;line-height:.95;letter-spacing:-.03em}
.big.xl{font-size:64px}
.lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);font-weight:800}
.kv{display:grid;justify-items:end}
.kv b{font-size:22px;letter-spacing:-.02em;line-height:1}
.kv.l{justify-items:start}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:8px;font-size:11.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;
  background:var(--neu-bg);color:var(--mute);white-space:nowrap;line-height:1.2}
.chip.up{background:var(--up-bg);color:var(--up)} .chip.dn{background:var(--dn-bg);color:var(--dn)}
.chip.cau{background:var(--cau-bg);color:var(--cau)} .chip.acc{background:var(--acc-bg);color:var(--acc)}
.chip.solid{background:var(--acc);color:var(--acc-ink)}
.chip.lg{font-size:13px;padding:6px 10px}
.pos{display:inline-grid;place-items:center;min-width:32px;height:22px;padding:0 5px;border-radius:7px;font-size:11px;font-weight:800;letter-spacing:.04em;color:var(--pos-ink);background:var(--kd);flex:none}
.pos.QB{background:var(--qb)} .pos.RB{background:var(--rb)} .pos.WR{background:var(--wr)} .pos.TE{background:var(--te)}
.mono{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:12px;background:var(--s3);border:1px solid var(--line2);font-size:12px;font-weight:800;letter-spacing:.02em;color:var(--mute);flex:none}
.sign{font-weight:800}
.sign.up{color:var(--up)} .sign.dn{color:var(--dn)} .sign.cau{color:var(--cau)} .sign.neu{color:var(--mute)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 6px;border-radius:6px;flex:none}
.tag.dn{background:var(--dn-bg);color:var(--dn)} .tag.cau{background:var(--cau-bg);color:var(--cau)} .tag.up{background:var(--up-bg);color:var(--up)}

/* player line */
.pl{display:flex;align-items:center;gap:10px;min-width:0;padding:8px 0}
.pl+.pl{border-top:1px solid var(--line)}
.pl .nm{display:grid;min-width:0;flex:1;gap:1px}
.pl .nm b{font-size:15px;line-height:1.2;overflow-wrap:anywhere}
.pl .nm small{font-size:12px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pl .val{display:grid;justify-items:end;flex:none;gap:2px;min-width:44px}
.pl .val b{font-size:19px;line-height:1;letter-spacing:-.02em}
.pl .val small{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase}
.pl.dead .val b{color:var(--dn)}
.pl.ghost .nm b{color:var(--mute)}
.pl .sg{width:16px;text-align:center;font-weight:800;font-size:16px;flex:none}
.pl .sg.in{color:var(--up)} .pl .sg.out{color:var(--dn)}
.pl.in{background:var(--up-bg);border-radius:10px;padding-inline:8px;border-top:0}
.pl.out{padding-inline:8px}

/* bars */
.bar{height:6px;border-radius:6px;background:var(--s4);overflow:hidden;position:relative}
.bar i{position:absolute;inset:0;transform-origin:left;transform:scaleX(var(--w,0));background:var(--acc);border-radius:6px;animation:grow .9s var(--ease) both;animation-delay:calc(var(--i,0)*45ms + .15s)}
.bar i.up{background:var(--up)} .bar i.dn{background:var(--dn)} .bar i.neu{background:var(--neu)} .bar i.cau{background:var(--cau)}
.bar i.hatch{background:repeating-linear-gradient(135deg,var(--mute) 0 3px,transparent 3px 7px)}
@keyframes grow{from{transform:scaleX(0)}}
.cmp{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.cmp .bar{height:8px}
.cmp .bar.l i{transform-origin:right}
.cmp b{font-size:14px;min-width:36px;text-align:center}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.vs .kv{justify-items:start} .vs .kv.r{justify-items:end}
.vs .mid{font-size:11px;font-weight:800;color:var(--dim);letter-spacing:.1em}

/* spark */
.spark{width:100%;height:36px}
.spark path.l{fill:none;stroke:var(--acc);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:400;stroke-dashoffset:0;animation:draw 1s var(--ease) both}
.spark path.a{fill:color-mix(in srgb,var(--acc) 18%,transparent)}
.spark circle{fill:var(--acc)}
.spark .proj{fill:none;stroke:var(--mute);stroke-width:1.5;stroke-dasharray:3 3}
.spark .bye{fill:var(--dn);font-size:7px;font-weight:800}
@keyframes draw{from{stroke-dashoffset:400}}

/* expandable */
.x{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s var(--ease),opacity .3s;opacity:0}
.x>div{overflow:hidden;min-height:0}
.open>.x,.x.open{grid-template-rows:1fr;opacity:1}
.xbtn{display:flex;align-items:center;justify-content:center;gap:6px;min-height:44px;width:100%;border-radius:10px;background:var(--s2);border:1px solid var(--line);font-size:13px;font-weight:800;color:var(--mute);transition:background var(--t),color var(--t)}
.xbtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;transition:transform .3s var(--spring)}
.open .xbtn svg,.xbtn[aria-expanded="true"] svg{transform:rotate(180deg)}
.open .xbtn{color:var(--fg)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:0 16px;border-radius:13px;font-weight:800;font-size:14.5px;
  background:var(--s3);border:1px solid var(--line2);transition:transform var(--t) var(--spring),background var(--t),color var(--t),border-color var(--t)}
.btn:active{transform:scale(.95)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.ok{background:var(--up-bg);border-color:transparent;color:var(--up)}
.btn.full{width:100%}
.btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.btn.star[aria-pressed="true"]{color:var(--cau)} .btn.star[aria-pressed="true"] svg{fill:var(--cau)}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quick button{display:grid;justify-items:center;gap:7px;padding:12px 4px 10px;border-radius:14px;background:var(--s2);border:1px solid var(--line);font-size:11.5px;font-weight:800;color:var(--mute);
  transition:transform var(--t) var(--spring),background var(--t),color var(--t)}
.quick button:active{transform:scale(.94)}
.quick svg{width:22px;height:22px;fill:none;stroke:var(--acc);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* done */
.card.done{opacity:.55}
.card.done .ttl{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--mute)}
.card.done .x{display:none}
.chk{width:40px;height:40px;border-radius:99px;border:1.5px solid var(--line2);display:grid;place-items:center;flex:none;transition:background var(--t),border-color var(--t),transform var(--t) var(--spring)}
.chk:active{transform:scale(.9)}
.chk svg{width:18px;height:18px;fill:none;stroke:var(--mute);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.chk[aria-pressed="true"]{background:var(--up);border-color:var(--up)} .chk[aria-pressed="true"] svg{stroke:var(--acc-ink)}

/* home: league card matchup */
.mu{display:grid;gap:8px}
.mu .names{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.mu .names b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mu .names b.r{text-align:right}
.mu .scores{display:grid;grid-template-columns:1fr auto 1fr;align-items:baseline}
.mu .scores b{font-size:34px;letter-spacing:-.03em;line-height:1}
.mu .scores b.r{text-align:right}
.mu .scores span{font-size:11px;letter-spacing:.1em;color:var(--dim);font-weight:800;text-align:center}
.mu .pr{display:grid;grid-template-columns:1fr auto 1fr;font-size:12.5px;color:var(--mute);font-weight:700}
.mu .pr .r{text-align:right}
.ladder{display:flex;gap:3px;align-items:end;height:18px}
.ladder i{flex:1;height:7px;border-radius:3px;background:var(--s4)}
.ladder i.po{background:var(--line2)} .ladder i.me{height:18px;background:var(--acc);box-shadow:0 0 12px color-mix(in srgb,var(--acc) 60%,transparent)}

/* slot table */
.slots{display:grid;gap:2px}
.slot{display:grid;grid-template-columns:42px 1fr 52px;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.slot:first-child{border-top:0}
.slot .k{font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--acc)}
.slot .k.bn{color:var(--dim)}
.slot .n{display:grid;min-width:0}
.slot .n b{font-size:15px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .n small{font-size:12px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.slot .p{display:grid;justify-items:end;gap:3px}
.slot .p b{font-size:18px;line-height:1;letter-spacing:-.02em}
.slot .p .bar{width:48px;height:4px}
.slot.dead .p b{color:var(--dn)}
.slot .live{font-size:10.5px;font-weight:800;letter-spacing:.06em;color:var(--mute)}
.slot .live.on{color:var(--up)}
.h2h .slot{grid-template-columns:1fr 44px 1fr}
.h2h .side{display:grid;min-width:0}
.h2h .side b{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.h2h .side.r{text-align:right}
.h2h .side small{font-size:11px}
.h2h .mid{display:grid;justify-items:center;gap:2px;font-size:10.5px;font-weight:800;letter-spacing:.06em;color:var(--dim)}
.h2h .mid b{font-size:14px;color:var(--fg)}

/* table */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);text-align:left;padding:4px 6px;font-weight:800}
.tbl td{padding:9px 6px;border-top:1px solid var(--line);vertical-align:middle}
.tbl td.n,.tbl th.n{text-align:right}
.tbl tr.me td{background:var(--acc-bg)}
.tbl td:first-child{border-radius:8px 0 0 8px} .tbl td:last-child{border-radius:0 8px 8px 0}
.scrollx{overflow-x:auto;margin-inline:-4px;padding-inline:4px}

/* lists */
.news li{display:grid;gap:3px;padding:10px 0;border-top:1px solid var(--line)}
.news li:first-child{border-top:0}
.news .who{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--acc)}
.news p{font-weight:700;line-height:1.3;text-wrap:pretty;font-size:14.5px}
.news a{text-decoration:none} .news a:hover{text-decoration:underline}
.news small{font-size:11.5px}
.steps li{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start;padding:6px 0}
.steps .n{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;border:1.5px solid var(--acc);color:var(--acc);font-size:13px;font-weight:800}
.kvs{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}
.kvs div{background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:10px 10px 8px;display:grid;gap:3px}
.kvs b{font-size:20px;letter-spacing:-.02em;line-height:1}
.kvs small{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase}
.stack{display:grid;gap:6px}
.evidence{display:grid;gap:4px;font-size:13px;color:var(--mute)}
.evidence b{color:var(--fg)}
.bub{position:relative;background:var(--acc);color:var(--acc-ink);padding:10px 13px;border-radius:16px 16px 4px 16px;font-size:14.5px;font-weight:600;line-height:1.35}
.foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:10px;border-top:1px solid var(--line);flex-wrap:wrap}
.calm{padding:22px 16px;border-radius:var(--r);border:1px dashed var(--line2);text-align:center;color:var(--mute);font-weight:700;display:grid;gap:4px;justify-items:center}
.calm b{color:var(--fg);font-size:17px}
.empty{color:var(--mute);font-size:13.5px;font-weight:600;padding:8px 2px}

/* filters / search */
.search{display:flex;align-items:center;gap:10px;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:0 12px;min-height:46px}
.search svg{width:18px;height:18px;fill:none;stroke:var(--mute);stroke-width:2.2;stroke-linecap:round;flex:none}
.search input{flex:1;min-width:0;background:none;border:0;outline:none;font-size:15.5px;font-weight:600;padding:10px 0}
.search input::placeholder{color:var(--dim)}
.pills{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px;margin:-2px}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;min-height:40px;padding:0 13px;border-radius:99px;background:var(--s2);border:1px solid var(--line);font-size:13px;font-weight:800;color:var(--mute);
  transition:background var(--t),color var(--t),border-color var(--t),transform var(--t) var(--spring)}
.pill:active{transform:scale(.95)}
.pill[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.pchip{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 10px 0 4px;border-radius:10px;background:var(--s2);border:1px solid var(--line);font-size:13.5px;font-weight:700;max-width:100%;text-align:left;
