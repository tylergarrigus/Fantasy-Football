name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        # No network, no credentials. The whole suite runs offline against
        # fixtures -- if it needs a secret to pass, the test is wrong.
        run: pytest -q

      - name: Verify league isolation explicitly
        # These two files encode the core product requirement. Calling them out
        # separately means a failure here is unmissable in the CI log.
        run: pytest tests/test_league_isolation.py tests/test_critical_divergence.py -v
