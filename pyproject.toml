[project]
name = "ff-gm"
version = "0.1.0"
description = "Autonomous fantasy football GM: watches two ESPN leagues and the NFL, and contacts you only when something should change what you do."
requires-python = ">=3.11"
dependencies = [
    "espn-api>=0.44.0",
    "requests>=2.32.0",
    "apprise>=1.9.0",
    "anthropic>=0.69.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
# nflverse usage data (snap counts, target share). Heavy (pyarrow/polars) --
# the agent degrades to DATA UNAVAILABLE without it rather than failing.
usage = ["nflreadpy>=0.1.0"]
dev = ["pytest>=8.0.0", "pytest-cov>=5.0.0"]

[project.scripts]
ff = "ff.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ff*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
